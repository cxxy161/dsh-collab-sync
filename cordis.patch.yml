# dsh-collab-sync bundle 层。
# 1) webserver 行覆盖：必须同时带出 host 与 port（patch 语义 = 整体替换 config）。
#    优先级：命令行 --host > 环境变量 DSH_WEB_BIND > 默认 127.0.0.1（安全回退）。
#    开放多 IP：/collab/settings 配置页写入 ~/.dsh/.env 的 DSH_WEB_BIND，重启生效。
# 2) connection 行覆盖：trustedHosts = web-runtime 自动推导 + DSH_WEB_EXTRA_TRUSTED。
# 3) 插入插件行。
- id: webserver
  config:
    host: !!js (ctx.webStartup?.host ?? process.env.DSH_WEB_BIND ?? '127.0.0.1')
    port: !!js (ctx.webStartup?.port ?? 3080)

- id: connection
  config:
    trustedHosts: !!js [...(ctx.webRuntime?.trustedHosts ?? []), ...(process.env.DSH_WEB_EXTRA_TRUSTED?.split(',').map((s) => s.trim()).filter(Boolean) ?? [])]

- insert:
    - id: dsh-collab-sync
      name: dsh-collab-sync
      config:
        mode: auto
        lockStaleAfterMs: 15000
        heartbeatMs: 5000
        repairOnBoot: true
        repairBackupSuffix: '.corrupt.bak'
        presence: true
